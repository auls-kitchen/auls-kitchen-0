<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUL's Kitchen — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1D16; --surface:#132920; --surface-hi:#1C3A2C; --line:rgba(215,235,225,0.10);
    --cream:#F3EFE6; --muted:#9FB8AA; --green:#00704A; --green-dim:rgba(0,112,74,0.35);
    --yellow:#E8A33D;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:var(--bg); color:var(--cream);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; height:100vh;
  }
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  header{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-shrink:0;
    background:rgba(31,22,17,0.9);
  }
  .back-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--cream);
    width:36px; height:36px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .back-btn svg{ width:18px; height:18px; }
  header .title{ font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; }
  header .subtitle{ color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace; }

  nav.tabs{
    display:flex; gap:8px; padding:12px 18px; border-bottom:1px solid var(--line);
    overflow-x:auto; flex-shrink:0;
  }
  .tab-btn{
    flex-shrink:0; background:var(--surface); border:1px solid var(--line); color:var(--muted);
    padding:9px 16px; border-radius:20px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn.active{ background:var(--green-dim); border-color:var(--green); color:var(--cream); font-weight:600; }
  .tab-btn.disabled{ opacity:0.4; cursor:not-allowed; }

  main{ flex:1; overflow-y:auto; padding:18px; }

  .filter-row{ display:flex; gap:8px; margin-bottom:18px; }
  .filter-btn{
    flex:1; background:var(--surface); border:1px solid var(--line); color:var(--muted);
    padding:11px; border-radius:12px; font-size:13px; cursor:pointer; text-align:center;
  }
  .filter-btn.active{ background:var(--yellow); border-color:var(--yellow); color:#000; font-weight:700; }

  .summary-card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-bottom:14px;
  }
  .summary-label{ color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:0.08em; font-family:'JetBrains Mono', monospace; margin-bottom:6px; }
  .summary-amount{ font-family:'JetBrains Mono', monospace; font-size:2rem; font-weight:600; color:var(--cream); }
  .summary-sub{ color:var(--muted); font-size:12.5px; margin-top:4px; }

  .method-grid{ display:flex; gap:12px; margin-bottom:18px; }
  .method-card{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px;
  }
  .method-name{ font-family:'Fraunces', serif; font-size:1.05rem; margin-bottom:8px; }
  .method-amount{ font-family:'JetBrains Mono', monospace; font-size:1.3rem; color:var(--yellow); font-weight:600; }
  .method-count{ color:var(--muted); font-size:12px; margin-top:4px; }

  .section-label{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); font-family:'JetBrains Mono', monospace; margin:20px 0 10px; }

  .tx-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line); gap:10px;
  }
  .tx-left{ min-width:0; }
  .tx-name{ font-size:13.5px; font-weight:600; }
  .tx-meta{ color:var(--muted); font-size:11.5px; margin-top:2px; }
  .tx-right{ text-align:right; flex-shrink:0; }
  .tx-amount{ font-family:'JetBrains Mono', monospace; color:var(--yellow); font-size:13.5px; }
  .tx-method{
    display:inline-block; margin-top:3px; font-size:10px; padding:2px 8px; border-radius:10px;
    font-family:'JetBrains Mono', monospace; border:1px solid var(--line); color:var(--muted);
  }

  .empty-msg{ text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px; }
  .loading-msg{ text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px; }

  .add-expense-btn{
    width:100%; background:var(--green); color:#fff; border:none; padding:13px;
    border-radius:20px; font-weight:600; font-size:14px; cursor:pointer; margin-bottom:18px;
  }
  .product-toolbar-row{ display:flex; gap:8px; margin-bottom:18px; }
  .product-toolbar-row .add-expense-btn{ margin-bottom:0; }
  .product-toolbar-row .category-mgmt-btn{
    flex:0 0 auto; width:auto; padding-left:18px; padding-right:18px;
    background:var(--surface-hi); border:1px solid var(--green); color:var(--yellow);
  }
  .product-toolbar-row #addProductBtn{ flex:1; }
  .expense-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line); gap:10px;
  }
  .expense-left{ min-width:0; }
  .expense-cat{ font-size:13.5px; font-weight:600; }
  .expense-meta{ color:var(--muted); font-size:11.5px; margin-top:2px; }
  .expense-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .expense-amount{ font-family:'JetBrains Mono', monospace; color:#E8544A; font-size:13.5px; }
  .expense-del-btn{ background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; }
  .expense-del-btn svg{ width:16px; height:16px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,7,5,0.8); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:300; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .expense-modal{ width:100%; max-width:380px; background:var(--surface-hi); border:1px solid var(--line); border-radius:18px; padding:22px; max-height:85vh; overflow-y:auto; }
  .expense-modal-title{ font-size:1.2rem; margin-bottom:16px; text-align:center; }
  .field-group{ margin-bottom:14px; }
  .field-group label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-family:'JetBrains Mono', monospace; }
  .opt-tag{ text-transform:none; letter-spacing:0; opacity:0.6; font-family:'Plus Jakarta Sans', sans-serif; }
  .field-input{
    width:100%; margin-top:6px; background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--cream); font-family:'Plus Jakarta Sans', sans-serif; font-size:14px; outline:none;
  }
  .field-input:focus{ border-color:var(--green-dim); }
  .field-input[readonly]{ opacity:0.65; cursor:not-allowed; }
  select.field-input option:disabled{ color:var(--yellow); }
  .category-legacy-warning{
    margin-top:8px; padding:10px 12px; border-radius:10px; font-size:12px; line-height:1.5;
    background:rgba(232,163,61,0.12); border:1px solid var(--yellow); color:var(--yellow);
  }
  .expense-modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-cancel{ flex:1; padding:12px; border-radius:20px; background:var(--surface); border:1px solid var(--line); color:var(--muted); cursor:pointer; }
  .modal-confirm{ flex:1.4; padding:12px; border-radius:20px; background:var(--green); border:none; color:#fff; font-weight:600; cursor:pointer; }

  .labarugi-note{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:18px;
  }
  .labarugi-warning{
    background:rgba(232,163,61,0.12); border:1px solid var(--yellow); border-radius:12px;
    padding:12px 14px; font-size:12px; color:var(--yellow); line-height:1.6; margin-bottom:18px;
  }
  .lr-row{ display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; font-size:14px; }
  .lr-row span{ color:var(--muted); }
  .lr-row strong{ font-family:'JetBrains Mono', monospace; font-size:1.1rem; }
  .lr-positive{ color:var(--cream); }
  .lr-negative{ color:#E8544A; }
  .lr-divider{ border-top:1px solid var(--line); margin:6px 0; }
  .lr-final{ padding-top:14px; }
  .lr-final span{ font-size:15px; font-weight:700; color:var(--cream); text-transform:uppercase; letter-spacing:0.05em; font-family:'JetBrains Mono', monospace; }
  .lr-final strong{ font-size:1.8rem; }
  .ing-row{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px;
  }
  .ing-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .ing-name{ font-family:'Fraunces', serif; font-size:1.05rem; }
  .ing-status{
    font-size:10px; font-family:'JetBrains Mono', monospace; padding:3px 9px; border-radius:10px;
    flex-shrink:0; white-space:nowrap;
  }
  .ing-status.ok{ background:rgba(0,112,74,0.2); color:#4CD787; border:1px solid #4CD787; }
  .ing-status.warn{ background:rgba(232,163,61,0.15); color:var(--yellow); border:1px solid var(--yellow); }
  .ing-status.out{ background:rgba(232,84,74,0.15); color:#E8544A; border:1px solid #E8544A; }
  .ing-meta{ display:flex; gap:18px; margin-top:8px; font-size:12px; color:var(--muted); }
  .ing-meta strong{ color:var(--cream); font-family:'JetBrains Mono', monospace; }
  .ing-actions{ display:flex; gap:8px; margin-top:10px; }
  .ing-action-btn{
    flex:1; background:var(--surface-hi); border:1px solid var(--line); color:var(--cream);
    padding:8px; border-radius:10px; font-size:12px; cursor:pointer;
  }
  .bahan-subtabs{ display:flex; gap:8px; margin-bottom:16px; }
  .subtab-btn{
    flex:1; background:var(--surface); border:1px solid var(--line); color:var(--muted);
    padding:10px; border-radius:12px; font-size:13px; cursor:pointer; text-align:center;
  }
  .subtab-btn.active{ background:var(--green-dim); border-color:var(--green); color:var(--cream); font-weight:600; }

  .recipe-row{
    display:flex; gap:8px; align-items:center; margin-bottom:8px;
  }
  .recipe-row select, .recipe-row input{
    background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--cream);
    padding:9px 10px; font-size:13px;
  }
  .recipe-row select{ flex:2; min-width:0; }
  .recipe-row input{ flex:1; min-width:0; }
  .recipe-row-del{ background:none; border:none; color:var(--muted); cursor:pointer; flex-shrink:0; }
  .recipe-row-del svg{ width:16px; height:16px; }

  .product-recipe-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .product-recipe-item .pr-name{ font-size:13.5px; font-weight:600; }
  .product-recipe-item .pr-hpp{ font-family:'JetBrains Mono', monospace; color:var(--yellow); font-size:12.5px; }
  .product-recipe-item .pr-edit{
    background:var(--surface-hi); border:1px solid var(--line); color:var(--cream);
    padding:6px 12px; border-radius:10px; font-size:11.5px; cursor:pointer; margin-left:10px;
  }
  .product-list-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px; margin-bottom:10px;
  }
  .product-thumb{
    width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0;
    background:var(--surface-hi);
  }
  .product-thumb-placeholder{
    width:52px; height:52px; border-radius:10px; flex-shrink:0;
    background:var(--surface-hi); display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:10px; text-align:center;
  }
  .product-list-info{ flex:1; min-width:0; }
  .product-list-name{ font-size:14px; font-weight:600; }
  .product-list-meta{ color:var(--muted); font-size:11.5px; margin-top:2px; }
  .product-list-actions{ display:flex; gap:6px; flex-shrink:0; }
  .product-list-actions button{
    background:var(--surface-hi); border:1px solid var(--line); color:var(--cream);
    padding:7px 11px; border-radius:9px; font-size:11px; cursor:pointer;
  }
  .product-search{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; color:var(--cream); font-size:13.5px; margin-bottom:14px; outline:none;
  }

  .photo-preview-frame{
    width:160px; height:160px; border-radius:14px; border:1.5px dashed var(--line);
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    overflow:hidden; margin:0 auto;
  }
  .photo-preview-frame img{ width:100%; height:100%; object-fit:cover; display:none; }
  #photoPreviewPlaceholder{ color:var(--muted); font-size:12px; text-align:center; padding:10px; }
  .photo-status{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:8px; min-height:16px; }

  .modifier-group-box{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px;
  }
  .modifier-group-top{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .modifier-group-top input[type="text"]{
    flex:1; background:var(--bg); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; color:var(--cream); font-size:13px;
  }
  .modifier-group-del{ background:none; border:none; color:var(--muted); cursor:pointer; flex-shrink:0; }
  .modifier-group-del svg{ width:16px; height:16px; }
  .modifier-required-label{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); margin-bottom:10px; }
  .modifier-option-row{
    display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap;
  }
  .modifier-option-row input[type="text"]{
    background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--cream);
    padding:7px 9px; font-size:12px; flex:1.4; min-width:70px;
  }
  .modifier-option-row input[type="number"]{
    background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--cream);
    padding:7px 9px; font-size:12px; width:72px;
  }
  .modifier-option-row .default-radio{ flex-shrink:0; }
  .modifier-option-del{ background:none; border:none; color:var(--muted); cursor:pointer; flex-shrink:0; }
  .modifier-option-del svg{ width:14px; height:14px; }
  .modifier-option-recipe-btn{
    background:var(--surface-hi); border:1px solid var(--line); color:var(--muted);
    font-size:10px; padding:5px 8px; border-radius:7px; cursor:pointer; flex-shrink:0;
  }
  .modifier-add-option-btn{
    background:none; border:1px dashed var(--line); color:var(--muted);
    width:100%; padding:8px; border-radius:8px; font-size:12px; cursor:pointer; margin-top:4px;
  }
  .modifier-option-recipe-rows{ margin:6px 0 6px 0; padding-left:8px; border-left:2px solid var(--line); display:none; }
  .modifier-option-recipe-rows.show{ display:block; }
</style>
</head>
<body>

<header>
  <button class="back-btn" id="backBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div>
    <div class="title display">AUL's Kitchen</div>
    <div class="subtitle">ADMIN</div>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="rekap">Rekap Pembayaran</button>
  <button class="tab-btn" data-tab="pengeluaran">Pengeluaran</button>
  <button class="tab-btn" data-tab="labarugi">Finansial</button>
  <button class="tab-btn" data-tab="bahan">Bahan Baku</button>
  <button class="tab-btn" data-tab="produk">Produk</button>
</nav>

<main>
  <div class="filter-row" id="filterRow">
    <button class="filter-btn active" data-period="today">Hari Ini</button>
    <button class="filter-btn" data-period="month">Bulan Ini</button>
    <button class="filter-btn" data-period="all">Semua</button>
  </div>

  <div id="content">
    <div class="loading-msg">Memuat data...</div>
  </div>
</main>

<!-- MODAL TAMBAH PENGELUARAN -->
<div class="modal-overlay" id="expenseModalOverlay">
  <div class="expense-modal">
    <div class="expense-modal-title display">Tambah Pengeluaran</div>
    <div class="field-group">
      <label>Tanggal</label>
      <input type="date" class="field-input" id="expenseDate">
    </div>
    <div class="field-group">
      <label>Kategori</label>
      <select class="field-input" id="expenseCategory">
        <option value="Sewa Tempat">Sewa Tempat</option>
        <option value="Listrik">Listrik</option>
        <option value="Air Galon">Air Galon</option>
        <option value="Gaji">Gaji</option>
        <option value="Bahan Baku">Bahan Baku</option>
        <option value="Marketing">Marketing</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>
    <div class="field-group">
      <label>Nominal</label>
      <input type="number" inputmode="numeric" class="field-input" id="expenseAmount" placeholder="0">
    </div>
    <div class="field-group">
      <label>Catatan <span class="opt-tag">(opsional)</span></label>
      <input type="text" class="field-input" id="expenseNote" placeholder="Contoh: beli galon air">
    </div>
    <div class="expense-modal-actions">
      <button class="modal-cancel" id="expenseCancelBtn">Batal</button>
      <button class="modal-confirm" id="expenseSaveBtn">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH BAHAN BAKU -->
<div class="modal-overlay" id="ingredientModalOverlay">
  <div class="expense-modal">
    <div class="expense-modal-title display">Tambah Bahan Baku</div>
    <div class="field-group">
      <label>Nama Bahan</label>
      <input type="text" class="field-input" id="ingName" placeholder="Contoh: Susu Full Cream">
    </div>
    <div class="field-group">
      <label>Satuan</label>
      <select class="field-input" id="ingUnit">
        <option value="ml">ml</option>
        <option value="gr">gr</option>
        <option value="pcs">pcs</option>
        <option value="sac">sac</option>
        <option value="press">press</option>
      </select>
    </div>
    <div class="field-group">
      <label>Stok Awal</label>
      <input type="number" inputmode="numeric" class="field-input" id="ingStock" placeholder="0">
    </div>
    <div class="field-group">
      <label>Harga per Satuan Awal</label>
      <input type="number" inputmode="numeric" class="field-input" id="ingCost" placeholder="0">
    </div>
    <div class="field-group">
      <label>Minimum Stok (buat warning)</label>
      <input type="number" inputmode="numeric" class="field-input" id="ingMinStock" placeholder="0">
    </div>
    <div class="expense-modal-actions">
      <button class="modal-cancel" id="ingCancelBtn">Batal</button>
      <button class="modal-confirm" id="ingSaveBtn">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL CATAT PEMBELIAN -->
<div class="modal-overlay" id="purchaseModalOverlay">
  <div class="expense-modal">
    <div class="expense-modal-title display">Catat Pembelian</div>
    <div class="field-group">
      <label>Bahan</label>
      <div id="purchaseIngName" style="font-weight:600;padding:6px 0;"></div>
    </div>
    <div class="field-group">
      <label>Tanggal</label>
      <input type="date" class="field-input" id="purchaseDate">
    </div>
    <div class="field-group">
      <label>Jumlah Dibeli</label>
      <input type="number" inputmode="numeric" class="field-input" id="purchaseQty" placeholder="0">
    </div>
    <div class="field-group">
      <label>Total Harga</label>
      <input type="number" inputmode="numeric" class="field-input" id="purchaseTotal" placeholder="0">
    </div>
    <div class="field-group">
      <label>Cost Rata-rata Baru</label>
      <div id="purchasePreview" style="font-family:'JetBrains Mono',monospace;color:var(--yellow);font-size:1.1rem;padding:6px 0;">-</div>
    </div>
    <div class="expense-modal-actions">
      <button class="modal-cancel" id="purchaseCancelBtn">Batal</button>
      <button class="modal-confirm" id="purchaseSaveBtn">Simpan</button>
    </div>
  </div>
</div>

<!-- MODAL RESEP PRODUK -->
<div class="modal-overlay" id="recipeModalOverlay">
  <div class="expense-modal" style="max-width:420px;">
    <div class="expense-modal-title display">Resep Produk</div>
    <div class="field-group">
      <label>Pilih Produk</label>
      <select class="field-input" id="recipeProductSelect"></select>
    </div>
    <div class="section-label" style="margin-top:14px;">Bahan dalam Resep</div>
    <div id="recipeRows"></div>
    <button class="add-expense-btn" id="recipeAddRowBtn" type="button" style="margin-top:10px;">+ Tambah Bahan</button>
    <div class="field-group" style="margin-top:14px;">
      <label>Estimasi HPP</label>

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyB2498KtjyVe7pZ-RfPYvQybdJmlzUpqwg",
  authDomain: "auls-kitchen.firebaseapp.com",
  projectId: "auls-kitchen",

// Foto produk disimpan di Cloudinary (bukan Firebase Storage — akun ini
// nggak bisa upgrade ke plan Blaze karena kendala metode pembayaran).
const CLOUDINARY_CLOUD_NAME = "hfv9oezk";

const fmt = n => "Rp " + Math.ceil(n).toLocaleString("id-ID");

document.getElementById("backBtn").addEventListener("click", () => {

});

let currentTab = "rekap";
let currentPeriod = "today";
let allTransactions = [];
let allExpenses = [];

document.querySelectorAll(".tab-btn[data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {

    render();

});

document.querySelectorAll(".filter-btn").forEach(btn => {

    document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b === btn));
    currentPeriod = btn.dataset.period;
    render();
  });
});

function isInPeriod(date, period) {
  const now = new Date();
  if (period === "all") return true;
  if (period === "today") {
    return date.getFullYear() === now.getFullYear() &&
           date.getMonth() === now.getMonth() &&
           date.getDate() === now.getDate();
  }
  if (period === "month") {
    return date.getFullYear() === now.getFullYear() &&
           date.getMonth() === now.getMonth();
  }
  return true;
}

function render() {
  document.getElementById("filterRow").style.display = (currentTab === "bahan" || currentTab === "produk") ? "none" : "flex";
  if (currentTab === "rekap") renderRekap();
  else if (currentTab === "pengeluaran") renderPengeluaran();
  else if (currentTab === "labarugi") renderLabaRugi();
  else if (currentTab === "bahan") renderBahan();
  else if (currentTab === "produk") renderProducts();
}

function renderRekap() {
  const content = document.getElementById("content");
  const filtered = allTransactions.filter(tx => tx.createdAtDate && isInPeriod(tx.createdAtDate, currentPeriod));

  if (filtered.length === 0) {
    content.innerHTML = `<div class="empty-msg">Belum ada transaksi di periode ini.</div>`;
    return;
  }

  const totalPendapatan = filtered.reduce((s, tx) => s + (tx.total || 0), 0);
  const cashTx = filtered.filter(tx => tx.paymentMethod === "Cash");
  const qrisTx = filtered.filter(tx => tx.paymentMethod === "QRIS");
  const cashTotal = cashTx.reduce((s, tx) => s + (tx.total || 0), 0);
  const qrisTotal = qrisTx.reduce((s, tx) => s + (tx.total || 0), 0);

  const rowsHtml = filtered.slice(0, 50).map(tx => {
    const timeStr = tx.createdAtDate.toLocaleString("id-ID", { dateStyle: "short", timeStyle: "short" });
    const itemSummary = (tx.items || []).map(i => `${i.name} x${i.qty}`).join(", ");
    return `
      <div class="tx-row">
        <div class="tx-left">
          <div class="tx-name">${tx.noStruk || timeStr}${tx.customerName ? " — " + tx.customerName : ""}</div>
          <div class="tx-meta">${timeStr} · ${itemSummary}</div>
        </div>
        <div class="tx-right">
          <div class="tx-amount">${fmt(tx.total || 0)}</div>
          <div class="tx-method">${tx.paymentMethod || "-"}</div>
        </div>
      </div>
    `;
  }).join("");

  content.innerHTML = `
    <div class="summary-card">
      <div class="summary-label">Total Pendapatan</div>
      <div class="summary-amount">${fmt(totalPendapatan)}</div>
      <div class="summary-sub">${filtered.length} transaksi</div>
    </div>
    <div class="method-grid">
      <div class="method-card">
        <div class="method-name">Cash</div>
        <div class="method-amount">${fmt(cashTotal)}</div>
        <div class="method-count">${cashTx.length} transaksi</div>
      </div>
      <div class="method-card">
        <div class="method-name">QRIS</div>
        <div class="method-amount">${fmt(qrisTotal)}</div>
        <div class="method-count">${qrisTx.length} transaksi</div>
      </div>
    </div>
    <div class="section-label">Rincian Transaksi (untuk cross-check closing)</div>
    ${rowsHtml}
  `;
}

function renderLabaRugi() {
  const content = document.getElementById("content");
  const filteredTx = allTransactions.filter(tx => tx.createdAtDate && isInPeriod(tx.createdAtDate, currentPeriod));
  const filteredEx = allExpenses.filter(ex => ex.createdAtDate && isInPeriod(ex.createdAtDate, currentPeriod));

  const omzet = filteredTx.reduce((s, tx) => s + (tx.total || 0), 0);
  const pengeluaran = filteredEx.reduce((s, ex) => s + (ex.amount || 0), 0);

  // HPP: dari transactions[].items[] -> cocokkan ke products by name -> products.recipe -> computeHpp()
  let hpp = 0;
  let missingRecipeCount = 0;
  filteredTx.forEach(tx => {
    (tx.items || []).forEach(item => {
      const product = allProducts.find(p => p.name === item.name);
      const hppPerUnit = computeHpp(product ? product.recipe : null); // null = belum ada resep
      if (hppPerUnit === null) {
        missingRecipeCount++;
      } else {
        hpp += hppPerUnit * (item.qty || 0);
      }
    });
  });

  const labaKotor = omzet - hpp;
  const labaBersih = labaKotor - pengeluaran;

  // rekap pengeluaran per kategori, biar kelihatan kemana aja uangnya kepake
  const byCategory = {};
  filteredEx.forEach(ex => {
    byCategory[ex.category] = (byCategory[ex.category] || 0) + (ex.amount || 0);
  });
  const categoryRows = Object.entries(byCategory)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, amt]) => `
      <div class="tx-row">
        <div class="tx-left"><div class="tx-name">${cat}</div></div>
        <div class="tx-right"><div class="tx-amount">${fmt(amt)}</div></div>
      </div>
    `).join("");

  content.innerHTML = `
    ${missingRecipeCount > 0 ? `
      <div class="labarugi-warning">
        ⚠️ ${missingRecipeCount} item terjual belum bisa dihitung HPP-nya (produk belum punya resep) — dihitung Rp 0 sementara. HPP di bawah ini masih di bawah nilai sebenarnya.
      </div>
    ` : ""}
    <div class="lr-row">
      <span>Omzet</span>
      <strong class="lr-positive">${fmt(omzet)}</strong>
    </div>
    <div class="lr-row">
      <span>HPP</span>
      <strong class="lr-negative">- ${fmt(hpp)}</strong>
    </div>
    <div class="lr-divider"></div>
    <div class="lr-row lr-final">
      <span>Laba Kotor</span>
      <strong class="${labaKotor >= 0 ? 'lr-positive' : 'lr-negative'}">${fmt(labaKotor)}</strong>
    </div>
    <div class="lr-row" style="margin-top:16px;">
      <span>Pengeluaran Operasional</span>
      <strong class="lr-negative">- ${fmt(pengeluaran)}</strong>
    </div>
    <div class="lr-divider"></div>
    <div class="lr-row lr-final">
      <span>Estimasi Laba Bersih</span>
      <strong class="${labaBersih >= 0 ? 'lr-positive' : 'lr-negative'}">${fmt(labaBersih)}</strong>
    </div>
    ${categoryRows ? `<div class="section-label">Pengeluaran per Kategori</div>${categoryRows}` : ""}
  `;
}

function renderPengeluaran() {
  const content = document.getElementById("content");
  const filtered = allExpenses.filter(ex => ex.createdAtDate && isInPeriod(ex.createdAtDate, currentPeriod));
  const totalPengeluaran = filtered.reduce((s, ex) => s + (ex.amount || 0), 0);

          </button>
        </div>
      </div>
    `;
  }).join("");

  content.innerHTML = `
    <button class="add-expense-btn" id="addExpenseBtn">+ Tambah Pengeluaran</button>
    <div class="summary-card">
      <div class="summary-label">Total Pengeluaran</div>

// =========================================================
// BAHAN BAKU + RESEP + AVERAGE COST
// =========================================================
let allIngredients = [];
let allProducts = [];
let bahanSubTab = "stok"; // "stok" | "resep"

function ingredientStatus(ing) {
  if ((ing.stock || 0) <= 0) return "out";
  if ((ing.stock || 0) <= (ing.minStock || 0)) return "warn";
  return "ok";
}
function ingredientStatusLabel(status) {
  return status === "out" ? "HABIS" : status === "warn" ? "MENIPIS" : "AMAN";
}

function computeHpp(recipe) {
  if (!recipe || recipe.length === 0) return null;
  let total = 0;
  for (const row of recipe) {
    const ing = allIngredients.find(i => i.id === row.ingredientId);
    if (!ing) continue;
    total += (ing.avgCost || 0) * (row.qty || 0);
  }
  return Math.ceil(total); // HPP = nilai cost, dibulatkan ke atas (bukan qty bahan)
}

function renderBahan() {
  const content = document.getElementById("content");
  content.innerHTML = `
    <div class="bahan-subtabs">
      <button class="subtab-btn ${bahanSubTab === 'stok' ? 'active' : ''}" id="subtabStok">Stok Bahan</button>
      <button class="subtab-btn ${bahanSubTab === 'resep' ? 'active' : ''}" id="subtabResep">Resep Produk</button>
    </div>
    <div id="bahanContent"></div>
  `;
  document.getElementById("subtabStok").addEventListener("click", () => { bahanSubTab = "stok"; renderBahan(); });
  document.getElementById("subtabResep").addEventListener("click", () => { bahanSubTab = "resep"; renderBahan(); });

  if (bahanSubTab === "stok") renderStokBahan();
  else renderResepProduk();
}

function renderStokBahan() {
  const el = document.getElementById("bahanContent");
  const rows = allIngredients.map(ing => {
    const status = ingredientStatus(ing);
    return `
      <div class="ing-row" data-id="${ing.id}">
        <div class="ing-top">
          <div class="ing-name">${ing.name}</div>
          <div class="ing-status ${status}">${ingredientStatusLabel(status)}</div>
        </div>
        <div class="ing-meta">
          <div>Stok <strong>${(ing.stock || 0).toLocaleString("id-ID")} ${ing.unit}</strong></div>
          <div>Min <strong>${(ing.minStock || 0).toLocaleString("id-ID")} ${ing.unit}</strong></div>
          <div>Avg Cost <strong>${fmt(Math.round(ing.avgCost || 0))}/${ing.unit}</strong></div>
        </div>
        <div class="ing-actions">
          <button class="ing-action-btn" data-action="beli">+ Catat Pembelian</button>
          <button class="ing-action-btn" data-action="hapus">Hapus</button>
        </div>
      </div>
    `;
  }).join("");

  el.innerHTML = `
    <button class="add-expense-btn" id="addIngredientBtn">+ Tambah Bahan Baku</button>
    ${allIngredients.length === 0 ? '<div class="empty-msg">Belum ada bahan baku. Tambahin dulu di atas.</div>' : rows}
  `;

  document.getElementById("addIngredientBtn").addEventListener("click", openIngredientModal);
  el.querySelectorAll('[data-action="beli"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.closest(".ing-row").dataset.id;
      openPurchaseModal(id);
    });
  });
  el.querySelectorAll('[data-action="hapus"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.closest(".ing-row").dataset.id;
      const ing = allIngredients.find(i => i.id === id);
      if (confirm(`Hapus bahan "${ing.name}"? Resep yang pakai bahan ini nggak otomatis kehapus.`)) {
        deleteDoc(firestoreDoc(db, "ingredients", id)).catch(err => alert("Gagal hapus: " + err.message));
      }
    });
  });
}

function renderResepProduk() {
  const el = document.getElementById("bahanContent");
  if (allProducts.length === 0) {
    el.innerHTML = `<div class="empty-msg">Produk belum dimuat. Coba refresh halaman.</div>`;
    return;
  }
  const rows = allProducts.map(p => {
    const hpp = computeHpp(p.recipe);
    return `
      <div class="product-recipe-item" data-id="${p.id}">
        <div>
          <div class="pr-name">${p.name}</div>
          <div class="pr-hpp">${hpp !== null ? "HPP: " + fmt(Math.round(hpp)) : "Belum ada resep"}</div>
        </div>
        <button class="pr-edit" data-action="edit">Edit Resep</button>
      </div>
    `;
  }).join("");
  el.innerHTML = rows;
  el.querySelectorAll('[data-action="edit"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.closest(".product-recipe-item").dataset.id;
      openRecipeModal(id);
    });
  });
}

const ingredientModalOverlay = document.getElementById("ingredientModalOverlay");
function openIngredientModal() {
  document.getElementById("ingName").value = "";
  document.getElementById("ingUnit").value = "ml";
  document.getElementById("ingStock").value = "";
  document.getElementById("ingCost").value = "";
  document.getElementById("ingMinStock").value = "";
  ingredientModalOverlay.classList.add("show");
}
document.getElementById("ingCancelBtn").addEventListener("click", () => ingredientModalOverlay.classList.remove("show"));
document.getElementById("ingSaveBtn").addEventListener("click", async () => {
  const name = document.getElementById("ingName").value.trim();
  const unit = document.getElementById("ingUnit").value;
  const stock = Number(document.getElementById("ingStock").value) || 0;
  const avgCost = Number(document.getElementById("ingCost").value) || 0;
  const minStock = Number(document.getElementById("ingMinStock").value) || 0;
  if (!name) { alert("Nama bahan harus diisi."); return; }

  const saveBtn = document.getElementById("ingSaveBtn");
  saveBtn.disabled = true;
  try {
    // cek duplikat langsung ke Firestore (bukan cuma cache lokal), biar tetap konsisten
    // kalau ada client lain yang juga lagi input di saat bersamaan
    const snap = await getDocs(collection(db, "ingredients"));
    const isDup = snap.docs.some(d => (d.data().name || "").trim().toLowerCase() === name.toLowerCase());
    if (isDup) {
      alert(`Bahan baku dengan nama "${name}" sudah ada. Nama bahan harus unik.`);
      return;
    }
    await addDoc(collection(db, "ingredients"), { name, unit, stock, avgCost, minStock, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    ingredientModalOverlay.classList.remove("show");
  } catch (err) {

  const total = Number(document.getElementById("purchaseTotal").value) || 0;

document.getElementById("categoryFormSaveBtn").addEventListener("click", async () => {
  const rawKey = document.getElementById("catKey").value.trim();
  const label = document.getElementById("catLabel").value.trim();
  const categoryOrder = Number(document.getElementById("catOrder").value) || 99;

  if (!rawKey || !label) {
    alert("Key dan Label kategori harus diisi.");
    return;
  }
  // key dipakai sebagai Firestore doc ID DAN sebagai product.category string —
  // batasi ke karakter aman (huruf/angka/underscore/dash) biar konsisten dengan
  // pola key yang sudah dipakai (contoh: "coffee", "milky").
  if (!/^[a-zA-Z0-9_-]+$/.test(rawKey)) {
    alert("Key kategori hanya boleh huruf, angka, underscore, atau dash (tanpa spasi).");
    return;
  }

  const saveBtn = document.getElementById("categoryFormSaveBtn");
  saveBtn.disabled = true;
  try {
    const catDocRef = firestoreDoc(db, "categories", rawKey);

    if (!currentEditingCategoryKey) {
      // mode tambah: cek langsung ke Firestore (bukan cuma cache lokal) supaya
      // tetap aman kalau ada client lain yang input bersamaan — sama seperti
      // pola cek duplikat bahan baku/produk.
      const existing = await getDoc(catDocRef);
      if (existing.exists()) {
        alert(`Kategori dengan key "${rawKey}" sudah ada. Key kategori harus unik.`);
        return;
      }
      await setDoc(catDocRef, {
        label, categoryOrder,
        createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      });
    } else {
      // mode edit: key (doc ID) tidak berubah, hanya update label/order.
      await updateDoc(catDocRef, { label, categoryOrder, updatedAt: serverTimestamp() });
    }
    categoryFormModalOverlay.classList.remove("show");
  } catch (err) {
    alert("Gagal simpan kategori: " + err.message);
  } finally {
    saveBtn.disabled = false;
  }
});

// Reuse allCategories (sudah live-synced dari onSnapshot Scope 1A) — TIDAK bikin

// input text bebas, jadi form produk secara struktural TIDAK BISA membuat
// kategori baru (itu cuma bisa lewat Category Management).
function populateCategoryDropdown(product) {
  const select = document.getElementById("pCategory");
  const warningEl = document.getElementById("pCategoryLegacyWarning");
  select.innerHTML = "";
  warningEl.style.display = "none";
  warningEl.textContent = "";

  const currentValue = product ? product.category : null;
  const matched = currentValue ? allCategories.some(c => c.id === currentValue) : false;

  if (!product) {
    // Tambah produk baru: WAJIB pilih eksplisit, nggak ada default yang kepilih.
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "-- Pilih Kategori --";
    placeholder.disabled = true;
    placeholder.selected = true;
    select.appendChild(placeholder);
  } else if (!matched) {
    // Produk existing tapi category-nya nggak ada di Category Master (legacy/typo/test).
    // Tampilkan apa adanya, JANGAN diam-diam ganti ke kategori lain.
    const legacyOpt = document.createElement("option");
    legacyOpt.value = currentValue || "";
    legacyOpt.textContent = `⚠ Legacy: "${currentValue}" (tidak ada di Category Master)`;
    legacyOpt.disabled = true;
    legacyOpt.selected = true;
    select.appendChild(legacyOpt);

    warningEl.textContent = `⚠ Kategori produk ini ("${currentValue}") tidak terdaftar di Category Master. Produk TIDAK BISA disimpan sampai kategori yang valid dipilih dari daftar di bawah.`;
    warningEl.style.display = "block";
  }

  allCategories.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.label;
    if (matched && currentValue === c.id) opt.selected = true;
    select.appendChild(opt);

  // kalau legacy/placeholder, JANGAN disentuh — biarkan nilai lama (di-set oleh
  // openProductModal sebelum fungsi ini dipanggil) tetap tampil apa adanya.
  if (matched) {
    updateCategoryLabelOrderFields();
  }
}

// ---------- foto produk: crop 1:1 -> resize 800x800 -> compress -> WebP ----------
document.getElementById("pPhotoPickBtn").addEventListener("click", () => document.getElementById("pPhotoInput").click());
document.getElementById("pPhotoInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById("photoStatus").textContent = "Memproses foto...";
  try {
    const blob = await processImageTo800Webp(file);
    pendingPhotoBlob = blob;
    const url = URL.createObjectURL(blob);
    const img = document.getElementById("photoPreviewImg");
    img.src = url;
    img.style.display = "block";
    document.getElementById("photoPreviewPlaceholder").style.display = "none";
    document.getElementById("photoStatus").textContent = `Siap diupload (${(blob.size / 1024).toFixed(0)} KB, 800×800 WebP)`;
  } catch (err) {
    document.getElementById("photoStatus").textContent = "Gagal proses foto: " + err.message;
  }
});

function processImageTo800Webp(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const size = Math.min(img.width, img.height);
      const sx = (img.width - size) / 2;
      const sy = (img.height - size) / 2;
      const canvas = document.createElement("canvas");
      canvas.width = 800;
      canvas.height = 800;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 800, 800);
      canvas.toBlob(blob => {
        if (blob) resolve(blob); else reject(new Error("Gagal convert ke WebP"));
      }, "image/webp", 0.82);
    };
    img.onerror = () => reject(new Error("File bukan gambar yang valid"));
    img.src = URL.createObjectURL(file);
  });
}

    <div class="modifier-group-box" data-group-id="${group.id}">
      <div class="modifier-group-top">
        <input type="text" class="mg-name-input" placeholder="Nama grup (contoh: Sugar Level)" value="${group.name}">
        <button type="button" class="modifier-group-del" data-action="del-group">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
        </button>
      </div>
      <label class="modifier-required-label">
        <input type="checkbox" class="mg-required-input" ${group.required ? "checked" : ""}> Wajib dipilih
      </label>
      <div class="mg-options">
        ${group.options.map(opt => `
          <div class="modifier-option-row" data-option-id="${opt.id}">
            <input type="radio" class="default-radio" name="default-${group.id}" ${opt.isDefault ? "checked" : ""} data-action="set-default">
            <input type="text" class="mo-name-input" placeholder="Nama opsi" value="${opt.name}">
            <input type="number" inputmode="numeric" class="mo-price-input" placeholder="+Rp" value="${opt.price || ""}">
            <button type="button" class="modifier-option-recipe-btn" data-action="toggle-recipe">Resep (${(opt.recipe || []).length})</button>
            <button type="button" class="modifier-option-del" data-action="del-option">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div class="modifier-option-recipe-rows" data-recipe-for="${opt.id}"></div>
        `).join("")}
      </div>
      <button type="button" class="modifier-add-option-btn" data-action="add-option">+ Tambah Opsi</button>
    </div>
  `).join("");

  // wire per-group/option events (event delegation per group box)
  container.querySelectorAll(".modifier-group-box").forEach(groupBox => {
    const groupId = groupBox.dataset.groupId;
    const group = currentModifierGroups.find(g => g.id === groupId);

    groupBox.querySelector(".mg-name-input").addEventListener("input", (e) => { group.name = e.target.value; });
    groupBox.querySelector(".mg-required-input").addEventListener("change", (e) => { group.required = e.target.checked; });

    groupBox.querySelector('[data-action="del-group"]').addEventListener("click", () => {
      currentModifierGroups = currentModifierGroups.filter(g => g.id !== groupId);
      renderModifierGroupsUI();
    });
    groupBox.querySelector('[data-action="add-option"]').addEventListener("click", () => {
      group.options.push({ id: crypto.randomUUID(), name: "", price: 0, isDefault: false, recipe: [] });
      renderModifierGroupsUI();
    });

    groupBox.querySelectorAll(".modifier-option-row").forEach(optRow => {
      const optId = optRow.dataset.optionId;
      const option = group.options.find(o => o.id === optId);

      optRow.querySelector(".mo-name-input").addEventListener("input", (e) => { option.name = e.target.value; });
      optRow.querySelector(".mo-price-input").addEventListener("input", (e) => { option.price = Number(e.target.value) || 0; });
      optRow.querySelector('[data-action="set-default"]').addEventListener("change", () => {
        group.options.forEach(o => o.isDefault = (o.id === optId));
      });
      optRow.querySelector('[data-action="del-option"]').addEventListener("click", () => {
        group.options = group.options.filter(o => o.id !== optId);
        if (group.options.length && !group.options.some(o => o.isDefault)) group.options[0].isDefault = true;
        renderModifierGroupsUI();
      });
      optRow.querySelector('[data-action="toggle-recipe"]').addEventListener("click", () => {
        const recipeBox = groupBox.querySelector(`.modifier-option-recipe-rows[data-recipe-for="${optId}"]`);
        const isShowing = recipeBox.classList.contains("show");
        if (!isShowing) buildOptionRecipeRows(recipeBox, option);
        recipeBox.classList.toggle("show", !isShowing);
      });
    });
  });
}

function buildOptionRecipeRows(container, option) {
  function refreshCount() {
    const groupBox = container.closest(".modifier-group-box");
    const btn = groupBox.querySelector(`.modifier-option-row[data-option-id="${option.id}"] [data-action="toggle-recipe"]`);
    if (btn) btn.textContent = `Resep (${option.recipe.length})`;
  }
  function addRow(ingredientId, qty) {
    const row = document.createElement("div");
    row.className = "recipe-row modifier-mini-recipe-row";
    const opts = allIngredients.map(ing => `<option value="${ing.id}" ${ing.id === ingredientId ? "selected" : ""}>${ing.name} (${ing.unit})</option>`).join("");
    row.innerHTML = `
      <select class="mo-recipe-ing">${opts}</select>
      <input type="number" inputmode="numeric" class="mo-recipe-qty" placeholder="Qty" value="${qty || ""}">
      <button type="button" class="recipe-row-del">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
      </button>
    `;
    function sync() {
      option.recipe = [...container.querySelectorAll(".modifier-mini-recipe-row")].map(r => {
        const ingId = r.querySelector(".mo-recipe-ing").value;
        const q = Number(r.querySelector(".mo-recipe-qty").value) || 0;
        return { ingredientId: ingId, qty: q };
      }).filter(r => r.ingredientId && r.qty > 0);
      refreshCount();
    }
    row.querySelector(".recipe-row-del").addEventListener("click", () => { row.remove(); sync(); });
    row.querySelector(".mo-recipe-ing").addEventListener("change", sync);
    row.querySelector(".mo-recipe-qty").addEventListener("input", sync);
    container.appendChild(row);
  }
  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "modifier-add-option-btn";
  addBtn.textContent = "+ Tambah Bahan ke Opsi Ini";
  addBtn.addEventListener("click", () => addRow());

  container.innerHTML = "";
  const recipe = option.recipe && option.recipe.length ? option.recipe : [];
  recipe.forEach(r => addRow(r.ingredientId, r.qty));
  container.appendChild(addBtn);
}

// ---------- simpan produk ----------
async function uploadToCloudinary(blob) {
  const formData = new FormData();
  formData.append("file", blob);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  let res;
  try {
    res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: formData,
    });
  } catch (networkErr) {
    throw new Error("Gagal konek ke Cloudinary (cek koneksi internet).");
  }

  if (!res.ok) {
    let msg = `Upload ke Cloudinary gagal (status ${res.status}).`;
    try {
      const errJson = await res.json();
      if (errJson.error && errJson.error.message) msg = errJson.error.message;
    } catch (e) { /* biarin pesan default */ }
    throw new Error(msg);
  }

  const data = await res.json();
  if (!data.secure_url) throw new Error("Cloudinary tidak mengembalikan URL gambar.");
  return data.secure_url;
}

document.getElementById("productSaveBtn").addEventListener("click", async () => {
  const name = document.getElementById("pName").value.trim();
  const price = Number(document.getElementById("pPrice").value) || 0;
  const itemOrder = Number(document.getElementById("pItemOrder").value) || 99;

  // Scope 1D — defense in depth: JANGAN percaya pCategoryLabel/pCategoryOrder
  // dari DOM. Ambil ulang category key dari dropdown, lalu cari lagi di
  // allCategories (sumber kebenaran yang sama dengan Category Management).
  // Ini mencegah kombinasi category=B tapi categoryLabel/categoryOrder masih
  // punya nilai A yang lama.
  const categoryKey = document.getElementById("pCategory").value;
  const selectedCat = allCategories.find(c => c.id === categoryKey);

  if (!name || price <= 0) {
    alert("Nama dan Harga harus diisi dengan benar.");
    return;
  }
  if (!categoryKey || !selectedCat) {
    alert("Produk harus dipilih ke kategori yang valid dari Category Master sebelum bisa disimpan. Kategori lama/tidak dikenal (legacy) tidak bisa langsung disimpan ulang — pilih salah satu kategori dari daftar terlebih dahulu.");
    return;
  }
  const category = selectedCat.id;
  const categoryLabel = selectedCat.label;
  const categoryOrder = selectedCat.categoryOrder;

  const saveBtn = document.getElementById("productSaveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Menyimpan...";

  try {
    // cek duplikat nama produk langsung ke Firestore (bukan cuma cache lokal),
    // dicek sebelum upload foto biar nggak upload sia-sia kalau bakal ditolak
    const dupSnap = await getDocs(collection(db, "products"));
    const isDup = dupSnap.docs.some(d =>
      d.id !== currentEditingProductId &&
      (d.data().name || "").trim().toLowerCase() === name.toLowerCase()
    );
    if (isDup) {
      alert(`Produk dengan nama "${name}" sudah ada. Nama produk harus unik.`);
      saveBtn.disabled = false;
      saveBtn.textContent = "Simpan Produk";
      return;
    }

    // upload foto DULU (kalau ada foto baru) — kalau gagal, produk nggak ditulis/diubah sama sekali
    let imageUrl = currentProductPhotoUrl || null;
    if (pendingPhotoBlob) {
      saveBtn.textContent = "Upload foto...";
      imageUrl = await uploadToCloudinary(pendingPhotoBlob);
    }

    saveBtn.textContent = "Menyimpan...";
    const recipe = readPRecipeRows();
    const modifierGroups = currentModifierGroups
      .filter(g => g.name.trim())
      .map(g => ({
        ...g,
        options: g.options.filter(o => o.name.trim()),
      }));

    const productData = { name, price, category, categoryLabel, categoryOrder, itemOrder, recipe, modifierGroups };
    if (imageUrl) productData.imageUrl = imageUrl;

    let productId = currentEditingProductId;
    if (!productId) {
      await addDoc(collection(db, "products"), productData);
    } else {
      await updateDoc(firestoreDoc(db, "products", productId), productData);
    }

    productModalOverlay.classList.remove("show");
  } catch (err) {
    alert("Gagal simpan produk: " + err.message);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Simpan Produk";
  }
});
</script>
