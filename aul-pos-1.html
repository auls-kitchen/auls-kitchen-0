<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUL's Kitchen — Kasir</title>
<link rel="manifest" href="manifest-pos.json">
<meta name="theme-color" content="#00704A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kasir">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1D16; --surface:#132920; --surface-hi:#1C3A2C; --line:rgba(215,235,225,0.10);
    --cream:#F3EFE6; --muted:#9FB8AA; --green:#00704A; --green-dim:rgba(0,112,74,0.35);
    --yellow:#E8A33D;
    --c-coffee:#C68958; --c-milky:#A78BDB; --c-soda:#FF6F59; --c-blend:#59C3B4;
    --c-tea:#9FCB3B; --c-cooler:#6FB1E8; --c-choco:#B07A46;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }
  body{
    background:var(--bg); color:var(--cream);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .pos-wrap{ display:flex; height:100vh; width:100vw; }

  /* ---------- LEFT: MENU ---------- */
  .pos-menu{
    flex:1 1 68%;
    display:flex; flex-direction:column;
    border-right:1px solid var(--line);
    min-width:0;
  }
  .pos-header{
    padding:14px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(31,22,17,0.9); flex-shrink:0;
  }
  .adm-nav-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.08em;
    padding:8px 16px; border-radius:20px; cursor:pointer;
  }
  .adm-nav-btn:active{ background:var(--surface-hi); }
  .pos-header-brand{ display:flex; align-items:center; gap:10px; }
  .pos-header-logo{ height:38px; width:auto; display:none; }
  .pos-header-logo.show{ display:block; }
  .pos-header .title{ font-family:'Fraunces', serif; font-weight:600; font-size:1.1rem; }
  .pos-header .subtitle{ color:var(--muted); font-size:11px; font-family:'JetBrains Mono', monospace; }
  .category-scroll{ flex:1; overflow-y:auto; padding:10px 14px 75vh; }

  .cat-block{ margin-bottom:8px; border-radius:12px; overflow:hidden; background:var(--surface); border:1px solid var(--line); }
  .cat-header{
    width:100%; display:flex; align-items:center; gap:10px;
    padding:13px 14px; background:none; border:none; cursor:pointer;
    color:var(--cream); text-align:left;
  }
  .cat-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .cat-name{ font-family:'Fraunces', serif; font-size:1.02rem; font-weight:600; flex:1; }
  .cat-count{ color:var(--muted); font-size:11.5px; font-family:'JetBrains Mono', monospace; }
  .cat-chevron{ color:var(--muted); transition:transform .2s; font-size:12px; }
  .cat-block.open .cat-chevron{ transform:rotate(180deg); }
  .cat-block.open .cat-header{ border-bottom:1px solid var(--line); }

  .cat-items{ display:none; }
  .cat-block.open .cat-items{ display:block; }

  .item-block{ border-top:1px solid var(--line); }
  .item-block:first-child{ border-top:none; }
  .item-row{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px 12px 30px; background:none; border:none; cursor:pointer;
    color:var(--cream); text-align:left; gap:10px;
  }
  .item-block.open .item-row{ background:var(--surface-hi); }
  .item-block.sold-out .item-row{ opacity:0.4; cursor:not-allowed; }
  .sold-out-tag{
    display:none; font-size:9.5px; font-family:'JetBrains Mono', monospace;
    color:#E8544A; border:1px solid #E8544A; border-radius:10px; padding:1px 7px;
    margin-left:8px; flex-shrink:0; text-transform:uppercase;
  }
  .item-block.sold-out .sold-out-tag{ display:inline-block; }
  .item-name{ font-size:14.5px; }
  .item-price{ font-family:'JetBrains Mono', monospace; font-size:13.5px; color:var(--yellow); flex-shrink:0; }

  .item-custom{ display:none; padding:14px 16px 16px 30px; background:var(--surface-hi); border-top:1px solid var(--line); }
  .item-block.open .item-custom{ display:block; }

  .opt-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; background:var(--surface); border:1px solid var(--line);
    border-radius:9px; margin-bottom:6px; cursor:pointer; font-size:13px;
  }
  .opt-row.checked{ border-color:var(--green-dim); background:rgba(0,112,74,0.15); }
  .opt-left{ display:flex; align-items:center; gap:9px; }
  .opt-check{
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--muted);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .opt-row.checked .opt-check{ background:var(--green); border-color:var(--green); }
  .opt-check svg{ width:10px; height:10px; color:#fff; opacity:0; }
  .opt-row.checked .opt-check svg{ opacity:1; }
  .opt-price{ font-family:'JetBrains Mono', monospace; font-size:11.5px; color:var(--muted); }
  .opt-row.checked .opt-price{ color:var(--cream); }

  .custom-bottom-row{ display:flex; align-items:center; gap:14px; margin-top:10px; }
  .qty-controls{ display:flex; align-items:center; gap:10px; }
  .qty-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface); color:var(--cream); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-value{ font-family:'JetBrains Mono', monospace; font-size:14px; min-width:18px; text-align:center; }
  .add-ticket-btn{
    flex:1; background:var(--green); color:#fff; border:none; padding:10px;
    border-radius:20px; font-weight:600; font-size:13px; cursor:pointer;
  }

  /* ---------- RIGHT: TIKET ---------- */
  .pos-ticket{
    flex:0 0 32%; max-width:340px; min-width:260px;
    display:flex; flex-direction:column;
    background:var(--surface);
  }
  .ticket-header{
    padding:14px 16px; border-bottom:1px solid var(--line);
    font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem;
    display:flex; align-items:center; justify-content:space-between;
  }
  .ticket-clear{ background:none; border:none; color:var(--muted); font-size:11px; cursor:pointer; font-family:'JetBrains Mono', monospace; }
  .ticket-list{ flex:1; overflow-y:auto; padding:10px 12px; }
  .ticket-empty{ text-align:center; color:var(--muted); font-size:13px; padding:40px 16px; display:none; }
  .ticket-empty.show{ display:block; }

  .ticket-item{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .ti-top{ display:flex; justify-content:space-between; gap:8px; }
  .ti-name{ font-size:13.5px; font-weight:600; }
  .ti-remove{ background:none; border:none; color:var(--muted); cursor:pointer; padding:0; flex-shrink:0; }
  .ti-remove svg{ width:14px; height:14px; }
  .ti-opts{ color:var(--muted); font-size:11px; margin-top:2px; }
  .ti-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .ti-qty{ display:flex; align-items:center; gap:8px; }
  .ti-qty-btn{ width:22px; height:22px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--cream); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .ti-qty-val{ font-family:'JetBrains Mono', monospace; font-size:12.5px; min-width:14px; text-align:center; }
  .ti-price{ font-family:'JetBrains Mono', monospace; color:var(--yellow); font-size:13px; }

  .ticket-footer{ padding:14px 16px; border-top:1px solid var(--line); }
  .ticket-total-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  .ticket-total-row span{ color:var(--muted); font-size:13px; }
  .ticket-total-row strong{ font-family:'JetBrains Mono', monospace; font-size:1.5rem; color:var(--cream); }
  .pay-btn{
    width:100%; background:var(--yellow); color:#000; border:none; padding:14px;
    border-radius:24px; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .pay-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  /* ---------- PAYMENT MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,7,5,0.8); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; z-index:300; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .pay-modal-row{ display:flex; align-items:flex-start; gap:16px; }
  .keypad{
    display:none; grid-template-columns:repeat(3, 62px); gap:8px;
    background:var(--surface-hi); border:1px solid var(--line); border-radius:16px; padding:12px;
  }
  .keypad.show{ display:grid; }
  .keypad-btn{
    width:62px; height:54px; border-radius:10px; background:var(--surface); border:1px solid var(--line);
    color:var(--cream); font-size:19px; font-family:'JetBrains Mono', monospace; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .keypad-btn:active{ background:var(--green-dim); border-color:var(--green-dim); }
  .keypad-btn.keypad-back{ color:var(--yellow); font-size:16px; }
  .pay-modal{ width:100%; max-width:380px; background:var(--surface-hi); border:1px solid var(--line); border-radius:18px; padding:22px; }
  .pay-modal-title{ margin-bottom:16px; text-align:center; }
  .pay-modal-title .label{ font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.12em; color:var(--muted); text-transform:uppercase; }
  .pay-modal-title .amount{ display:block; font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:2.4rem; color:var(--yellow); letter-spacing:-0.01em; margin-top:2px; }
  .pay-methods{ display:flex; gap:10px; margin-bottom:16px; }
  .pay-method-btn{ flex:1; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--cream); text-align:center; cursor:pointer; font-size:14px; }
  .pay-method-btn.selected{ border-color:var(--yellow); background:rgba(232,163,61,0.12); color:var(--yellow); font-weight:600; }
  .pay-method-btn.pay-method-name{ flex:0.8; }
  .pay-method-btn.pay-method-name.selected{ border-color:var(--green); background:var(--green-dim); color:var(--cream); }
  .name-field{ display:none; margin-bottom:14px; }
  .name-field.show{ display:block; }
  .name-field label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-family:'JetBrains Mono', monospace; }
  .opt-tag{ text-transform:none; letter-spacing:0; opacity:0.6; font-family:'Plus Jakarta Sans', sans-serif; }
  .cash-field{ display:none; margin-bottom:14px; }
  .cash-field.show{ display:block; }
  .cash-field label{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-family:'JetBrains Mono', monospace; }
  .cash-input{
    width:100%; margin-top:6px; background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; color:var(--cream); font-family:'JetBrains Mono', monospace; font-size:16px; outline:none;
  }
  .cash-input:focus{ border-color:var(--green-dim); }
  .change-row{ display:flex; justify-content:space-between; padding:10px 4px; font-size:13.5px; color:var(--muted); }
  .change-row strong{ color:var(--yellow); font-family:'JetBrains Mono', monospace; font-size:1.1rem; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-cancel{ flex:1; padding:12px; border-radius:20px; background:var(--surface); border:1px solid var(--line); color:var(--muted); cursor:pointer; }
  .modal-confirm{ flex:1.4; padding:12px; border-radius:20px; background:var(--green); border:none; color:#fff; font-weight:600; cursor:pointer; }
  .modal-confirm:disabled{ opacity:0.4; cursor:not-allowed; }

  .success-overlay{ position:fixed; inset:0; background:rgba(10,7,5,0.9); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:310; }
  .success-overlay.show{ display:flex; }
  .success-box{ text-align:center; }
  .success-icon{ width:64px; height:64px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  .success-icon svg{ width:30px; height:30px; color:#fff; }
  .success-title{ font-family:'Fraunces', serif; font-size:1.3rem; margin-bottom:6px; }
  .success-sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }
  .print-btn{ background:var(--surface-hi); border:1px solid var(--yellow); color:var(--yellow); padding:11px 22px; border-radius:20px; font-size:13.5px; cursor:pointer; margin:0 6px; }
  .close-success-btn{ background:var(--green); border:none; color:#fff; padding:11px 22px; border-radius:20px; font-size:13.5px; cursor:pointer; margin:0 6px; font-weight:600; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc as firestoreDoc, onSnapshot, setDoc,
  collection, addDoc, getDocs, updateDoc, increment, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB2498KtjyVe7pZ-RfPYvQybdJmlzUpqwg",
  authDomain: "auls-kitchen.firebaseapp.com",
  projectId: "auls-kitchen",
  storageBucket: "auls-kitchen.firebasestorage.app",
  messagingSenderId: "981577971183",
  appId: "1:981577971183:web:61148e193857035c94f21a"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const OPTION_GROUPS = {
  coffee: [
    { id:"less_sugar", label:"Less Sugar", price:0 },
    { id:"less_ice", label:"Less Ice", price:0 },
    { id:"double_shot", label:"Double Shot", price:3000 },
    { id:"stand_alone", label:"Stand Alone", price:2000 },
  ],
  default: [
    { id:"stand_alone", label:"Stand Alone", price:2000 },
  ],
};
function getOptionsFor(catKey){ return OPTION_GROUPS[catKey] || OPTION_GROUPS.default; }

// ===== PRODUK: sumber data sekarang Firestore (koleksi "products"), sama kayak menu konsumen =====
const CATEGORY_COLOR = {
  coffee:"var(--c-coffee)", milky:"var(--c-milky)", soda:"var(--c-soda)", blend:"var(--c-blend)",
  tea:"var(--c-tea)", cooler:"var(--c-cooler)", choco:"var(--c-choco)",
};
let MENU = [];
const RECIPE_MAP = {}; // key: "catKey|Nama Produk" -> recipe array [{ingredientId, ingredientName, qty}]

async function loadMenuFromFirestore() {
  const snap = await getDocs(collection(db, "products"));
  const byCategory = {};
  snap.forEach(docSnap => {
    const d = docSnap.data();
    if (!byCategory[d.category]) {
      byCategory[d.category] = {
        cat: d.categoryLabel || d.category,
        key: d.category,
        color: CATEGORY_COLOR[d.category] || "var(--gold)",
        catOrder: d.categoryOrder || 99,
        items: [],
      };
    }
    byCategory[d.category].items.push({ name: d.name, price: d.price, order: d.itemOrder || 99 });
    RECIPE_MAP[`${d.category}|${d.name}`] = d.recipe || [];
  });
  MENU = Object.values(byCategory).sort((a, b) => a.catOrder - b.catOrder);
  MENU.forEach(section => {
    section.items.sort((a, b) => a.order - b.order);
    section.items = section.items.map(it => [it.name, it.price]);
  });
}

const fmt = n => "Rp " + n.toLocaleString("id-ID");
const categoryScroll = document.getElementById("categoryScroll");
let ticket = []; // {key, name, catLabel, basePrice, options:[{id,label,price}], qty}

// ---------- build category / item accordion ----------
function buildCategoryUI() {
  categoryScroll.innerHTML = "";
  MENU.forEach(section => {
    const block = document.createElement("div");
    block.className = "cat-block";
    block.dataset.cat = section.key;

    const options = getOptionsFor(section.key);

    block.innerHTML = `
      <button class="cat-header">
        <span class="cat-dot" style="background:${section.color}"></span>
        <span class="cat-name">${section.cat.toUpperCase()}</span>
        <span class="cat-count mono">${section.items.length} menu</span>
        <span class="cat-chevron">▾</span>
      </button>
      <div class="cat-items">
        ${section.items.map(([name, price]) => `
          <div class="item-block" data-item="${name}" data-price="${price}" data-cat="${section.key}" data-catlabel="${section.cat}">
            <button class="item-row">
              <span class="item-name">${name}<span class="sold-out-tag">Habis</span></span>
              <span class="item-price mono">${fmt(price)}</span>
            </button>
            <div class="item-custom">
              ${options.map(opt => `
                <div class="opt-row" data-opt-id="${opt.id}">
                  <div class="opt-left">
                    <div class="opt-check">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
                    </div>
                    <span>${opt.label}</span>
                  </div>
                  <span class="opt-price mono">${opt.price > 0 ? "+" + fmt(opt.price) : "Rp 0"}</span>
                </div>
              `).join("")}
              <div class="custom-bottom-row">
                <div class="qty-controls">
                  <button class="qty-btn qty-minus">−</button>
                  <span class="qty-value mono">1</span>
                  <button class="qty-btn qty-plus">+</button>
                </div>
                <button class="add-ticket-btn">Masukkan ke Tiket</button>
              </div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
    categoryScroll.appendChild(block);
  });
  applySoldOutUI();
}

// ---------- sinkron status "Habis" dari menu konsumen (real-time) ----------
const soldOutDocRef = firestoreDoc(db, "status", "soldOut");
let soldOutSet = new Set();
function itemKey(catKey, name) { return `${catKey}|${name}`; }
function applySoldOutUI() {
  document.querySelectorAll(".item-block").forEach(block => {
    const key = itemKey(block.dataset.cat, block.dataset.item);
    const isSoldOut = soldOutSet.has(key);
    block.classList.toggle("sold-out", isSoldOut);
    if (isSoldOut) block.classList.remove("open");
  });
}
onSnapshot(soldOutDocRef, snap => {
  const data = snap.data();
  soldOutSet = new Set(data && data.items ? data.items : []);
  applySoldOutUI();
}, err => console.error("Gagal sinkron status stok:", err));

// muat produk dari Firestore lalu bangun tampilan kategori/menu
categoryScroll.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted);">Memuat menu...</div>`;
loadMenuFromFirestore()
  .then(() => buildCategoryUI())
  .catch(err => {
    console.error("Gagal memuat produk:", err);
    categoryScroll.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted);">Gagal memuat menu. Coba refresh halaman ya.</div>`;
  });

// accordion: category open/close (single open at a time)
categoryScroll.addEventListener("click", e => {
  const catHeader = e.target.closest(".cat-header");
  if (catHeader) {
    const block = catHeader.closest(".cat-block");
    const wasOpen = block.classList.contains("open");
    document.querySelectorAll(".cat-block.open").forEach(b => b.classList.remove("open"));
    if (!wasOpen) {
      block.classList.add("open");
      block.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    return;
  }

  const itemRow = e.target.closest(".item-row");
  if (itemRow) {
    const itemBlock = itemRow.closest(".item-block");
    if (itemBlock.classList.contains("sold-out")) return;
    const wasOpen = itemBlock.classList.contains("open");
    // close any other open item within the same category
    itemBlock.closest(".cat-items").querySelectorAll(".item-block.open").forEach(b => b.classList.remove("open"));
    if (!wasOpen) {
      itemBlock.classList.add("open");
      itemBlock.querySelector(".qty-value").textContent = "1";
      itemBlock.querySelectorAll(".opt-row.checked").forEach(o => o.classList.remove("checked"));
      itemBlock.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    return;
  }

  const optRow = e.target.closest(".opt-row");
  if (optRow) {
    optRow.classList.toggle("checked");
    return;
  }

  const qtyMinus = e.target.closest(".qty-minus");
  if (qtyMinus) {
    const valEl = qtyMinus.closest(".custom-bottom-row").querySelector(".qty-value");
    let v = parseInt(valEl.textContent);
    if (v > 1) valEl.textContent = v - 1;
    return;
  }
  const qtyPlus = e.target.closest(".qty-plus");
  if (qtyPlus) {
    const valEl = qtyPlus.closest(".custom-bottom-row").querySelector(".qty-value");
    valEl.textContent = parseInt(valEl.textContent) + 1;
    return;
  }

  const addBtn = e.target.closest(".add-ticket-btn");
  if (addBtn) {
    const itemBlock = addBtn.closest(".item-block");
    const catBlock = itemBlock.closest(".cat-block");
    const catKey = itemBlock.dataset.cat;
    const catLabel = itemBlock.dataset.catlabel;
    const name = itemBlock.dataset.item;
    const basePrice = Number(itemBlock.dataset.price);
    const qty = parseInt(itemBlock.querySelector(".qty-value").textContent);
    const checked = [...itemBlock.querySelectorAll(".opt-row.checked")].map(r => {
      const opt = getOptionsFor(catKey).find(o => o.id === r.dataset.optId);
      return opt;
    });
    addToTicket(catKey, catLabel, name, basePrice, checked, qty);
    // tutup semua accordion (item + kategori), lalu kembalikan posisi scroll ke header kategori itu
    itemBlock.classList.remove("open");
    catBlock.classList.remove("open");
    catBlock.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

function addToTicket(catKey, catLabel, name, basePrice, options, qty) {
  const optionIds = options.map(o => o.id).sort().join(",");
  const key = `${catKey}|${name}|${optionIds}`;
  const existing = ticket.find(t => t.key === key);
  if (existing) {
    existing.qty += qty;
  } else {
    ticket.push({ key, catKey, catLabel, name, basePrice, options, qty });
  }
  renderTicket();
}

function lineTotal(item) {
  const addOn = item.options.reduce((s, o) => s + o.price, 0);
  return (item.basePrice + addOn) * item.qty;
}

function renderTicket() {
  const ticketList = document.getElementById("ticketList");
  const ticketEmpty = document.getElementById("ticketEmpty");
  const payBtn = document.getElementById("payBtn");

  if (ticket.length === 0) {
    ticketList.innerHTML = "";
    ticketEmpty.classList.add("show");
    payBtn.disabled = true;
    document.getElementById("ticketTotal").textContent = fmt(0);
    pushLiveTicket();
    return;
  }
  ticketEmpty.classList.remove("show");
  payBtn.disabled = false;

  ticketList.innerHTML = ticket.map((item, idx) => {
    const optLabels = item.options.length ? item.options.map(o => o.label).join(", ") : "Original";
    return `
      <div class="ticket-item" data-idx="${idx}">
        <div class="ti-top">
          <div>
            <div class="ti-name">${item.name}</div>
            <div class="ti-opts">${optLabels}</div>
          </div>
          <button class="ti-remove" data-action="remove">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
          </button>
        </div>
        <div class="ti-bottom">
          <div class="ti-qty">
            <button class="ti-qty-btn" data-action="minus">−</button>
            <span class="ti-qty-val mono">${item.qty}</span>
            <button class="ti-qty-btn" data-action="plus">+</button>
          </div>
          <div class="ti-price mono">${fmt(lineTotal(item))}</div>
        </div>
      </div>
    `;
  }).join("");

  const total = ticket.reduce((s, i) => s + lineTotal(i), 0);
  document.getElementById("ticketTotal").textContent = fmt(total);
  pushLiveTicket();
}

// ---------- kirim tiket berjalan ke Customer Display (real-time) ----------
let liveTicketDebounce = null;
function pushLiveTicket() {
  clearTimeout(liveTicketDebounce);
  liveTicketDebounce = setTimeout(() => {
    const total = ticket.reduce((s, i) => s + lineTotal(i), 0);
    const items = ticket.map(item => ({
      name: item.name,
      optLabels: item.options.length ? item.options.map(o => o.label).join(", ") : "Original",
      qty: item.qty,
      lineTotal: lineTotal(item),
    }));
    setDoc(firestoreDoc(db, "status", "liveTicket"), { items, total, updatedAt: serverTimestamp() })
      .catch(err => console.error("Gagal update customer display:", err));
  }, 300);
}

document.getElementById("ticketList").addEventListener("click", e => {
  const itemEl = e.target.closest(".ticket-item");
  if (!itemEl) return;
  const idx = Number(itemEl.dataset.idx);
  const action = e.target.closest("button")?.dataset.action;
  if (action === "remove") {
    ticket.splice(idx, 1);
  } else if (action === "plus") {
    ticket[idx].qty++;
  } else if (action === "minus") {
    ticket[idx].qty--;
    if (ticket[idx].qty <= 0) ticket.splice(idx, 1);
  } else {
    return;
  }
  renderTicket();
});

document.getElementById("ticketClearBtn").addEventListener("click", () => {
  if (ticket.length === 0) return;
  ticket = [];
  renderTicket();
});

// ---------- payment modal ----------
let paymentMethod = null;
const payModalOverlay = document.getElementById("payModalOverlay");
const cashField = document.getElementById("cashField");
const cashInput = document.getElementById("cashInput");
const changeAmountEl = document.getElementById("changeAmount");
const payConfirmBtn = document.getElementById("payConfirmBtn");
const numKeypad = document.getElementById("numKeypad");
const nameField = document.getElementById("nameField");
const customerNameInput = document.getElementById("customerNameInput");
const namaToggleBtn = document.getElementById("namaToggleBtn");

function selectPaymentMethod(method) {
  paymentMethod = method;
  document.querySelectorAll(".pay-method-btn[data-method]").forEach(b => b.classList.toggle("selected", b.dataset.method === method));
  if (method === "Cash") {
    cashField.classList.add("show");
    numKeypad.classList.add("show");
    payConfirmBtn.disabled = true;
    updateChange();
    cashInput.focus();
  } else {
    cashField.classList.remove("show");
    numKeypad.classList.remove("show");
    payConfirmBtn.disabled = false;
  }
}

document.getElementById("payBtn").addEventListener("click", () => {
  cashInput.value = "";
  changeAmountEl.textContent = fmt(0);
  customerNameInput.value = "";
  nameField.classList.remove("show");
  namaToggleBtn.classList.remove("selected");
  document.getElementById("payModalAmount").textContent = currentTotal().toLocaleString("id-ID");
  payModalOverlay.classList.add("show");
  selectPaymentMethod("Cash"); // Cash aktif otomatis begitu modal dibuka
});
document.getElementById("payCancelBtn").addEventListener("click", () => {
  payModalOverlay.classList.remove("show");
});
document.querySelectorAll(".pay-method-btn[data-method]").forEach(btn => {
  btn.addEventListener("click", () => selectPaymentMethod(btn.dataset.method));
});
namaToggleBtn.addEventListener("click", () => {
  const isOpen = nameField.classList.toggle("show");
  namaToggleBtn.classList.toggle("selected", isOpen);
  if (isOpen) customerNameInput.focus();
});
function currentTotal(){ return ticket.reduce((s, i) => s + lineTotal(i), 0); }
function updateChange() {
  const received = Number(cashInput.value) || 0;
  const total = currentTotal();
  const change = received - total;
  changeAmountEl.textContent = fmt(Math.max(change, 0));
  payConfirmBtn.disabled = received < total;
}
cashInput.addEventListener("input", updateChange);

// numeric keypad — isi "Uang Diterima" tanpa perlu tap kolomnya / keyboard bawaan HP
numKeypad.addEventListener("click", e => {
  const btn = e.target.closest(".keypad-btn");
  if (!btn) return;
  if (navigator.vibrate) navigator.vibrate(6); // getar sangat singkat, sekadar feedback halus
  const val = btn.dataset.val;
  if (val === "back") {
    cashInput.value = cashInput.value.slice(0, -1);
  } else {
    cashInput.value = (cashInput.value || "") + val;
  }
  updateChange();
  cashInput.focus();
});

let lastTransaction = null;

const KASIR_NAME = "Yan Santo"; // GANTI kalau nanti ada nama kasir lain / sistem login staff

function buildNoStruk(date) {
  const p = n => String(n).padStart(2, "0");
  const yy = p(date.getFullYear() % 100);
  const mm = p(date.getMonth() + 1);
  const dd = p(date.getDate());
  const hh = p(date.getHours());   // 24 jam (bawaan JS Date)
  const mi = p(date.getMinutes());
  const ss = p(date.getSeconds());
  return `${yy}${mm}${dd}${hh}${mi}${ss}`;
}

// ---------- stok otomatis: kurangi bahan baku sesuai resep tiap kali laku ----------
function deductStockForTicket(ticketItems) {
  const totalDeduct = {}; // ingredientId -> total qty terpakai

  ticketItems.forEach(item => {
    const recipe = RECIPE_MAP[`${item.catKey}|${item.name}`];
    if (!recipe || recipe.length === 0) return; // produk ini belum punya resep, skip
    recipe.forEach(row => {
      if (!row.ingredientId || !row.qty) return;
      totalDeduct[row.ingredientId] = (totalDeduct[row.ingredientId] || 0) + row.qty * item.qty;
    });
  });

  Object.entries(totalDeduct).forEach(([ingredientId, qty]) => {
    updateDoc(firestoreDoc(db, "ingredients", ingredientId), { stock: increment(-qty) })
      .catch(err => console.error("Gagal kurangi stok bahan:", ingredientId, err));
  });
}

payConfirmBtn.addEventListener("click", () => {
  const total = currentTotal();
  const cashReceived = paymentMethod === "Cash" ? Number(cashInput.value) || 0 : null;
  const change = paymentMethod === "Cash" ? Math.max(cashReceived - total, 0) : null;
  const customerName = customerNameInput.value.trim();
  const now = new Date();

  const transaction = {
    items: ticket.map(item => ({
      name: item.name,
      catLabel: item.catLabel,
      optLabels: item.options.length ? item.options.map(o => o.label).join(", ") : "Original",
      qty: item.qty,
      lineTotal: lineTotal(item),
    })),
    total,
    paymentMethod,
    cashReceived,
    change,
    customerName,
    noStruk: buildNoStruk(now),
    kasir: KASIR_NAME,
    source: "POS",
    status: "COMPLETED",
    createdAt: serverTimestamp(),
  };
  lastTransaction = { ...transaction, createdAt: now };

  addDoc(collection(db, "transactions"), transaction).catch(err => {
    console.error("Gagal simpan transaksi:", err);
  });

  deductStockForTicket(ticket);

  // beri tahu Customer Display supaya nampilin pop-up ucapan terima kasih
  setDoc(firestoreDoc(db, "status", "txPopup"), {
    paymentMethod,
    cashReceived,
    change,
    total,
    ts: Date.now(),
  }).catch(err => console.error("Gagal kirim pop-up ke customer display:", err));

  payModalOverlay.classList.remove("show");
  document.getElementById("successSub").textContent = `Total ${fmt(total)} — ${paymentMethod}`;
  document.getElementById("successOverlay").classList.add("show");
});

// =========================================================
// CETAK STRUK (ESC/POS mentah lewat RawBT) — bold/italic/double-width
// Catatan jujur: perintah italic (ESC 4 / ESC 5) tidak didukung semua
// printer thermal — kalau di printer kamu italic-nya nggak muncul,
// itu keterbatasan printernya, bukan bug di kode ini.
// =========================================================
const ESC = 0x1B, GS = 0x1D;
function bytesToBase64(bytes) {
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function textBytes(str) { return Array.from(str).map(c => c.charCodeAt(0) & 0xFF); }
function padLine(left, right, width = 32) {
  const space = Math.max(width - left.length - right.length, 1);
  return left + " ".repeat(space) + right;
}
const CMD = {
  init: () => [ESC, 0x40],
  align: n => [ESC, 0x61, n], // 0 kiri, 1 tengah, 2 kanan
  bold: on => [ESC, 0x45, on ? 1 : 0],
  italic: on => [ESC, on ? 0x34 : 0x35],
  doubleWidth: on => [GS, 0x21, on ? 0x10 : 0x00],
  feed: (n = 1) => Array(n).fill(0x0A),
};
function buildReceiptBytes(tx) {
  const line = "-".repeat(32);
  const dateStr = tx.createdAt.toLocaleString("id-ID", { dateStyle: "short", timeStyle: "short" });
  let b = [];
  const push = (...arr) => arr.forEach(a => b.push(...a));

  push(CMD.init(), CMD.align(1));
  // LOGO — belum ada gambar logo terpasang, jadi sementara nama toko dulu
  push(CMD.doubleWidth(true), textBytes("AUL's Kitchen"), CMD.feed(1), CMD.doubleWidth(false));
  push(CMD.italic(true), textBytes("Jl. Padasuka no. 64"), CMD.feed(1));
  push(textBytes("Bandung - Indonesia"), CMD.feed(1), CMD.italic(false));
  push(CMD.align(0), CMD.feed(1));

  push(textBytes(line), CMD.feed(1));
  push(textBytes(`Tanggal  : ${dateStr}`), CMD.feed(1));
  push(textBytes(`No.Struk : ${tx.noStruk}`), CMD.feed(1));
  push(textBytes(`Kasir    : ${tx.kasir}`), CMD.feed(1));
  if (tx.customerName) push(textBytes(`Nama     : ${tx.customerName}`), CMD.feed(1));
  push(textBytes(line), CMD.feed(1));

  push(textBytes(padLine("Menu", "Qty     Jumlah")), CMD.feed(1));
  push(textBytes(line), CMD.feed(1));

  tx.items.forEach(item => {
    push(CMD.bold(true), textBytes(item.name), CMD.bold(false), CMD.feed(1));
    push(textBytes(padLine(`  x${item.qty}`, fmt(item.lineTotal))), CMD.feed(1));
    if (item.optLabels && item.optLabels !== "Original") {
      push(CMD.italic(true), textBytes(`  ${item.optLabels}`), CMD.italic(false), CMD.feed(1));
    }
  });

  push(textBytes(line), CMD.feed(1));
  push(CMD.doubleWidth(true), CMD.bold(true), textBytes(padLine("Total", fmt(tx.total))), CMD.bold(false), CMD.doubleWidth(false), CMD.feed(1));
  if (tx.paymentMethod === "Cash") {
    push(textBytes(padLine("Cash", fmt(tx.cashReceived))), CMD.feed(1));
    push(textBytes(padLine("Kembali", fmt(tx.change))), CMD.feed(1));
  } else {
    push(textBytes(padLine("Metode", tx.paymentMethod)), CMD.feed(1));
  }
  push(textBytes(line), CMD.feed(1));

  push(CMD.align(1));
  push(CMD.bold(true), textBytes("Terima Kasih"), CMD.bold(false), CMD.feed(1));
  push(textBytes("Mampir lagi yaa kak.."), CMD.feed(4));
  return b;
}

function buildKitchenReceiptBytes(tx) {
  const line = "-".repeat(32);
  const dateStr = tx.createdAt.toLocaleString("id-ID", { dateStyle: "short", timeStyle: "short" });
  const totalQty = tx.items.reduce((s, i) => s + i.qty, 0);
  let b = [];
  const push = (...arr) => arr.forEach(a => b.push(...a));

  push(CMD.init(), CMD.align(0));
  push(textBytes(`Tanggal  : ${dateStr}`), CMD.feed(1));
  push(textBytes(`No.Struk : ${tx.noStruk}`), CMD.feed(1));
  if (tx.customerName) push(CMD.bold(true), textBytes(`Nama     : ${tx.customerName}`), CMD.bold(false), CMD.feed(1));
  push(textBytes(line), CMD.feed(1));

  push(CMD.doubleWidth(true));
  tx.items.forEach(item => {
    push(textBytes(`${item.name} x${item.qty}`), CMD.feed(1));
    if (item.optLabels && item.optLabels !== "Original") {
      push(textBytes(`  ${item.optLabels}`), CMD.feed(1));
    }
  });
  push(CMD.doubleWidth(false));

  push(textBytes(line), CMD.feed(1));
  push(CMD.bold(true), textBytes(`Jumlah Order : ${totalQty} Cup`), CMD.bold(false), CMD.feed(1));
  push(textBytes(line), CMD.feed(3));
  return b;
}

function sendToPrinter(bytes) {
  try {
    const encoded = bytesToBase64(bytes);
    window.location.href = `rawbt:base64,${encoded}`;
  } catch (err) {
    console.error("Gagal kirim ke RawBT:", err);
    alert("Gagal membuka RawBT. Pastikan aplikasi RawBT sudah terinstall dan printer sudah dipasangkan di sana.");
  }
}
function printReceipt(tx) { sendToPrinter(buildReceiptBytes(tx)); }
function printKitchenReceipt(tx) { sendToPrinter(buildKitchenReceiptBytes(tx)); }

document.getElementById("printBtn").addEventListener("click", () => {
  if (!lastTransaction) return;
  printReceipt(lastTransaction);
});
document.getElementById("closeSuccessBtn").addEventListener("click", () => {
  document.getElementById("successOverlay").classList.remove("show");
  if (lastTransaction) printKitchenReceipt(lastTransaction); // struk dapur otomatis dicetak di sini
  ticket = [];
  renderTicket();
  // tutup semua accordion & balik ke posisi scroll paling atas (default)
  document.querySelectorAll(".cat-block.open, .item-block.open").forEach(b => b.classList.remove("open"));
  categoryScroll.scrollTo({ top: 0, behavior: "instant" });
});

renderTicket();

document.getElementById("admNavBtn").addEventListener("click", () => {
  window.location.href = "aul-adm.html";
});
